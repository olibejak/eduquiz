[pytest]
# Pytest configuration for Selenium tests

# Minimum Python version
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test discovery
testpaths = .

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers
markers =
    smoke: Mark test as a smoke test
    auth: Mark test as an authentication test
    deck: Mark test as a deck management test
    quiz: Mark test as a quiz test
    flashcard: Mark test as a flashcard test
    settings: Mark test as a settings test

# Timeout for tests (seconds)
timeout = 300

# Log configuration
log_cli = false
log_cli_level = INFO

