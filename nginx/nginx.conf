events {
    worker_connections 1024;
}

http {
    # Formát logování
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Společné hlavičky
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_addrs_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;
        server_name localhost;

        # ----------------------------------------------------
        # Block internal API 
        # ----------------------------------------------------
        location /api/internal/ {
            deny all;
            return 404;
        }

        # ----------------------------------------------------
        # USER SERVICE -- REST
        # ----------------------------------------------------
        location /api/auth/ {
            proxy_pass http://user-service:8080/api/auth/;
        }
        
        location /api/users/ {
            proxy_pass http://user-service:8080/api/users/;
        }

        # ----------------------------------------------------
        # DECK SERVICE -- REST 
        # ----------------------------------------------------
        location /api/decks/ {
            proxy_pass http://deck-service:8080/api/decks/;
        }

        # ----------------------------------------------------
        # FLASHCARD SERVICE -- REST
        # ----------------------------------------------------
        location /api/flashcards/ {
            proxy_pass http://flashcard-service:8080/api/flashcards/;
        }

        # ----------------------------------------------------
        # QUIZ SERVICE -- REST
        # ----------------------------------------------------
        location /api/quiz/ {
            proxy_pass http://quiz-service:8080/api/quiz/;
        }

        # ----------------------------------------------------
        # QUIZ SERVICE -- WebSockets
        # ----------------------------------------------------
        location /ws-quiz {
            proxy_pass http://quiz-service:8080/ws-quiz;
            
            # Nutné hlavičky pro WebSocket tunel (HTTP Upgrade)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            
            # Dlouhé timeouty pro zamezení odpojování
            proxy_read_timeout 86400; 
            proxy_send_timeout 86400;
        }
    }
}
        # ----------------------------------------------------
        #  REST API -- Quiz Service
        # ----------------------------------------------------
        location /api/quiz/ {
            proxy_pass http://quiz-service:8080/api/;
        }

        # ----------------------------------------------------
        #  WebSocket -- Quiz Service 
        # ----------------------------------------------------
        location /ws-quiz/ {
            proxy_pass http://quiz-service:8080/ws-quiz/;
            
            # Upgrade -- HTTP -> WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            
            proxy_read_timeout 86400; 
            proxy_send_timeout 86400;
        }
    }
}
