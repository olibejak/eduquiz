spring:
  application:
    name: UserServiceApplication
  datasource:
    url: ${DB_URL}${USER_DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

app:
  security:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
    # Custom JWT
    jwt:
      secret: ${JWT_SECRET} # at least 256 bits / 32 characters
      expiration-ms: ${JWT_EXPIRATION} # [ms]
      issuer: ${JWT_ISSUER}
  rabbitmq:
    exchange:
      name: "quiz-exchange"

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15000
    instances:
      deckService:
        baseConfig: default
      rabbitPublisher:
        slidingWindowSize: 5
        failureRateThreshold: 80

logging:
  level:
    root: INFO

