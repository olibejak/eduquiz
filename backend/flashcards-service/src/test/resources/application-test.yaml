spring:
  application:
    name: FlashcardsServiceApplication
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: false

app:
  security:
    jwt:
      secret: "testsecretkey1234567890testsecretkey1234567890"

microservices:
  deck-service:
    url: http://localhost:8080

flashcards:
  spaced-repetition:
    rules:
      AGAIN:
        multiplier: 0.0
        min-days: 0
      HARD:
        multiplier: 1.2
        min-days: 1
      GOOD:
        multiplier: 2.5
        min-days: 1
      EXCELLENT:
        multiplier: 3.5
        min-days: 4

logging:
  level:
    root: WARN

