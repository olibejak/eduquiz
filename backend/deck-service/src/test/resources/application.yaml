spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop # Clear the database after each test run
    show-sql: true
    properties:
      hibernate:
        format_sql: true # Format SQL for better readability in logs
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com

app:
  security:
    jwt:
      secret: 4f9a2e6c18b7d3f0a4c1e8b95d72f63c0a9e7d41b6c8f2359ad04e1c7bf36215 # random testing secret

  rabbitmq:
    exchange:
      deck: deck.exchange.test
      user: user.exchange.test
    queue:
      user-deleted: user.deleted.queue.test

microservices:
  user-service:
    url: http://localhost:8080

logging:
  level:
    root: DEBUG