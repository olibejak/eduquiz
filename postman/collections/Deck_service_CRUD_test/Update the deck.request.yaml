$kind: http-request
name: Update the deck
url: http://localhost:8080/api/decks/{{deck_id}}
method: PUT
headers:
  - key: X-User-Id
    value: "1"
    description: User ID for testing purposes
body:
  type: json
  content: |-
    {
      "title": "Calculus",
      "description": "Learn calculus",
      "visibility": "PRIVATE",
      "tags": ["MATHEMATICS"]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Should return valid JSON", function () {
          pm.response.to.be.json;
      });

      pm.test("Deck should have changed values", function () {
          let jsonData = pm.response.json();
          pm.expect(jsonData.id).to.eql(pm.collectionVariables.get("deck_id")); 
          pm.expect(jsonData.title).to.eql("Calculus"); 
          pm.expect(jsonData.tags).to.include.members(["MATHEMATICS"]);
          pm.expect(jsonData.visibility).to.eql("PRIVATE");
          pm.expect(jsonData.createdAt).to.not.eql(jsonData.updatedAt);
      });
    language: text/javascript
order: 2132295408877238
