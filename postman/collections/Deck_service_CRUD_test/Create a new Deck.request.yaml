$kind: http-request
name: Create a new Deck
url: http://localhost:8080/api/decks
method: POST
headers:
  - key: X-User-Id
    value: "1"
    description: User ID for testing purposes
body:
  type: json
  content: |-
    {
      "title": "History of art",
      "description": "Test your skills in history of art",
      "visibility": "PUBLIC",
      "tags": ["ART", "HISTORY"]
    }
scripts:
  - type: afterResponse
    code: >-
      pm.test("Should return 201 Created", function () {
          pm.response.to.have.status(201);
      });


      pm.test("Should return valid JSON", function () {
          pm.response.to.be.json;
      });


      pm.test("Deck should generate ID and inlude correct title, tags and
      visibility", function () {
          let jsonData = pm.response.json();
          pm.expect(jsonData.id).to.not.be.undefined; 
          pm.collectionVariables.set("deck_id", jsonData.id);
          pm.expect(jsonData.title).to.eql("History of art");
          pm.expect(jsonData.tags).to.include.members(["ART", "HISTORY"]);
          pm.expect(jsonData.visibility).to.eql("PUBLIC");
      })
    language: text/javascript
order: 1773916658899
