$kind: http-request
name: Add the deck to favourites
url: http://localhost:8080/api/decks/{{deck_id}}/favorite
method: POST
headers:
  - key: X-User-Id
    value: "1"
    description: User ID for testing purposes
scripts:
  - type: afterResponse
    code: |-
      pm.test("Should return valid JSON", function () {
          pm.response.to.be.json;
      });

      pm.test("The deck should have favorites count eql to 1", function () {
          let jsonData = pm.response.json();
          pm.expect(jsonData.favoritesCount).to.eql(1);
      });
    language: text/javascript
examples: .resources/Add the deck to favourites.resources/examples
order: 74050516781192
