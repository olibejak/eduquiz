$kind: http-request
name: Bulk update
url: "{{baseUrl}}/api/decks/{{deckId}}/questions/bulk"
method: PUT
body:
  type: json
  content: |-
    {
      "updates": {
        "{{questionId}}": {
          "text": "Updated text of the existing question",
          "questionType": "MULTIPLE_CHOICE",
          "duration": 45,
          "answers": [
             {
               "text": "New correct answer",
               "type": "CHOICE",
               "payload": {
                 "isCorrect": true,
                 "type": "CHOICE"
               }
             }
          ]
        }
      },
      "creates": [
        {
          "text": "Match the correct pairs (capital and country)",
          "questionType": "MATCHING",
          "duration": 60,
          "answers": [
            {
              "text": "Prague",
              "type": "MATCHING",
              "payload": {
                "associate": true,
                "matchId": 1,
                "type": "MATCHING"
              }
            },
            {
              "text": "Czech Republic",
              "type": "MATCHING",
              "payload": {
                "associate": false,
                "matchId": 1,
                "type": "MATCHING"
              }
            }
          ]
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 2652370954375045
