services:
  postgres:
    image: postgres:18
    container_name: eduquiz_postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: default_db
    ports:
      - "127.0.0.1:5432:5432"
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - db_network
      - service_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d default_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: eduquiz_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    expose:
      - "5672"
      - "15672"
    networks:
      - service_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-gateway:
    image: nginx:1.29.5
    container_name: eduquiz_api_gw
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - service_network
    depends_on:
      - user-service
      - deck-service
      - quiz-service
      - flashcards-service
    restart: unless-stopped

  user-service:
    build: 
      context: ./backend/user-service
    container_name: user-service-app
    env_file:
      - .env
    expose:
      - "8080"
    networks:
      - service_network
      - db_network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  deck-service:
    build: 
      context: ./backend/deck-service
    container_name: deck-service-app
    env_file:
      - .env
    expose:
      - "8080"
    networks:
      - service_network
      - db_network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy 

  quiz-service:
    build: 
      context: ./backend/quiz-service
    container_name: quiz-service-app
    env_file:
      - .env
    expose:
      - "8080"
    networks:
      - service_network
      - db_network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  flashcards-service:
    build: 
      context: ./backend/flashcards-service
    container_name: flashcards-service-app
    env_file:
      - .env
    expose:
      - "8080"
    networks:
      - service_network
      - db_network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  service_network:
    driver: bridge

  db_network:
    driver: bridge
    internal: true
